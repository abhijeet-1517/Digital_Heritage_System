
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HeritageGraph | Archives</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Digital Archives</h1>
        <p>Register and discover heritage documentation.</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="/index.html">Dashboard</a>
        <a href="/assets.html">Assets</a>
        <a href="/conservation.html">Conservation</a>
        <a href="/funding.html">Funding</a>
        <a href="/archives.html" aria-current="page">Archives</a>
        <a href="/exhibitions.html">Exhibitions</a>
    </nav>

    <main>
        <div id="archives-message"
             class="message info"
             role="status"
             aria-live="polite"></div>

        <section class="card">
            <h2>Register Digital Archive</h2>

            <form id="archive-form">
                <div class="form-grid">
                    <div>
                        <label for="archive_id">Archive ID</label>
                        <input id="archive_id" name="archive_id" required>
                    </div>

                    <div>
                        <label for="archive-title">Archive Title</label>
                        <input id="archive-title" name="title" required>
                    </div>

                    <div>
                        <label for="archive-asset">Associated Asset</label>
                        <select id="archive-asset"
                                name="asset_id" required>
                            <option value="">Loading assets...</option>
                        </select>
                    </div>

                    <div>
                        <label for="file-reference">File Reference</label>
                        <input id="file-reference"
                               name="file_reference" required>
                    </div>

                    <div>
                        <label for="archive-access">Access Level</label>
                        <select id="archive-access"
                                name="access_level" required>
                            <option value="">Select access level</option>
                            <option value="Public">Public</option>
                            <option value="Restricted">Restricted</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit">Register Archive</button>
                </div>
            </form>
        </section>

        <section class="card">
            <h2>Search Archives</h2>
            <label for="archive-search">Archive title or ID</label>
            <input id="archive-search"
                   placeholder="Enter a title or archive ID">

            <div class="actions">
                <button type="button" id="archive-search-button">
                    Search
                </button>
                <button type="button" id="archive-clear-button">
                    Show All
                </button>
            </div>
        </section>

        <section class="card">
            <h2>Archive Records</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Archive ID</th>
                            <th>Title</th>
                            <th>Asset ID</th>
                            <th>File Reference</th>
                            <th>Access Level</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archives-table-body">
                        <tr>
                            <td colspan="6">Loading archives...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
